<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <title>
    El Viaje del Faro - Una Aventura Emocional
  </title>


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >


  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap"
    rel="stylesheet"
  >



  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>


<body>





  <div class="site-menu">
    <button
      class="menu-btn"
      id="menuBtn"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="menu-panel" id="menuPanel" hidden>
      <a href="index.html">Inicio / Cuestionario</a>
      <a href="Problematica.html">Problematica</a>
      <a href="recursos.html">Recursos de apoyo</a>
    </nav>
  </div>

  <div class="stars" id="stars"></div>

  <div
    class="glow-bg"
    id="glowBg"
  ></div>

  <header class="paec-header">
    <span class="paec-badge">
      Proyecto PAEC By:AyA
    </span>

    <span class="paec-title">
      Redes de Bienestar: Tejiendo por la salud mental y el éxito escolar
    </span>
  </header>




  <main
    class="container d-flex justify-content-center align-items-center game-container"
  >

    <section
      class="game-card fade-in"
      id="gameCard"
    >


      <div
        id="statsBar"
        class="d-none"
      >

        <div class="stats-row">

          <div
            class="stat-pill"
            id="statCalm"
            title="Tu capacidad de mantener la calma y resiliencia"
          >

            <span>
              🛡️ Resiliente:
            </span>

            <span
              class="stat-value"
              id="valCalm"
            >
              100
            </span>

          </div>


          <div
            class="stat-pill"
            id="statStress"
            title="Nivel acumulado de tensión"
          >

            <span>
              ⚡ Tensión:
            </span>

            <span
              class="stat-value"
              id="valStress"
            >
              0
            </span>

          </div>


          <div
            class="stat-pill"
            id="statSocial"
            title="Nivel de red de apoyo"
          >

            <span>
              🤝 Red de Apoyo:
            </span>

            <span
              class="stat-value"
              id="valSocial"
            >
              50
            </span>

          </div>

        </div>


        <!-- PROGRESO -->

        <div
          class="progress-container"
        >

          <div
            class="progress-bar-custom"
            id="progressBar"
          ></div>

        </div>

      </div>




      <div id="sceneContainer">
        <!-- El contenido se genera mediante JavaScript -->
      </div>


    </section>

  </main>



  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
  ></script>



  <script
    src="script.js"
  ></script>

</body>

</html>
